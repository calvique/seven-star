services:
  - type: web
    name: seven-star-school
    runtime: node
    buildCommand: >-
      npm --prefix frontend ci --include=dev &&
      npm --prefix backend ci --include=dev &&
      npm --prefix frontend run build &&
      npm --prefix backend run build
    startCommand: npm --prefix backend start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: JWT_EXPIRES_IN
        value: 15m
      - key: JWT_REFRESH_SECRET
        sync: false
      - key: JWT_REFRESH_EXPIRES_IN
        value: 30d
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_NAME
        value: School Administrator
      - key: ADMIN_PASSWORD
        sync: false
      - key: API_URL
        sync: false
